<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer Hexagon -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="rgba(255, 255, 255, 0.1)" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Y-shape lines forming a 3D isometric cube/crystal -->
  <polyline points="15,30 50,50 85,30" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="90" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Subtle inner facet highlight to enhance the "frosted glass" depth -->
  <line x1="50" y1="10" x2="50" y2="50" stroke="rgba(255, 255, 255, 0.3)" stroke-width="6" stroke-linecap="round"/>
</svg>
